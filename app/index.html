<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B3Networks</title>
  <script src="{{{appclient}}}"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1f2937;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 16px;
    }
    .session-label {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 8px;
    }
    .session-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #6b7280;
      word-break: break-all;
    }
    .status {
      margin-top: 12px;
      font-size: 10px;
      color: #9ca3af;
    }
    .status.connected { color: #059669; }
    .status.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="styles/images/b3-logo.svg" alt="B3Networks" />
    <div class="session-label">Session ID</div>
    <div id="sessionId" class="session-id">—</div>
    <div id="status" class="status">Initializing…</div>
  </div>

  <script src="scripts/app.js"></script>
</body>
</html>
